<title>SINGULARITY, INC. — Workstation</title>
<meta name="description" content="A founder simulation where your own assistant plays the world against you." />

<!-- Every asset path in this game is document-relative and written in
     JavaScript — `assets/img/act3.jpg` in a modal, a character's portrait, an
     ending plate. Served from /computer/ those would resolve one directory too
     deep and quietly 404. This resolves them all against the origin root, which
     is where the site deploys. Module imports are unaffected: they resolve
     against the module's own URL, not the document's. See docs/DEPLOY.md. -->
<base href="/" />

<!-- The Chrome origin trial for WebMCP. Tokens are issued per origin, not per
     path, so this is the same token index.html carries. See docs/DEPLOY.md. -->
<meta http-equiv="origin-trial" content="REPLACE_WITH_THE_TOKEN_FOR_THIS_ORIGIN" />

<meta property="og:type" content="website" />
