<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SINGULARITY, INC.</title>
<meta name="description" content="A founder simulation where your own assistant plays the world against you." />

<!-- The Chrome origin trial for WebMCP. Tokens are issued per origin and do not
     cover subdomains, so production and every preview deployment need their own.
     This tag is the one that actually carries the trial: on a host where an
     asset router answers before any middleware, the `Origin-Trial` header in
     `_headers` never runs for `/` at all. Ship both. See docs/DEPLOY.md.
     `localhost` needs neither — it is already a secure context. -->
<!-- Where Aperture lives when it is not rival.<this host>. Empty = the convention. -->
<meta name="rival-origin" content="" />
<meta http-equiv="origin-trial" content="REPLACE_WITH_THE_TOKEN_FOR_THIS_ORIGIN" />

<!-- Social preview. The act banners are already 1920x640, which is close
     enough to the 1.91:1 every card wants, so no new asset is needed. -->
<meta property="og:type" content="website" />

<meta property="og:description" content="A founder simulation where your own assistant plays the world against you. It writes the events, voices the rivals, turns the market — and you can take any of it away." />
